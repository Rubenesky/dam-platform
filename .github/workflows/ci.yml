name: CI
on:
  push:
    branches: [feature/devops-track, main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo, pdo_pgsql, pgsql, pdo_sqlite, sqlite3,
            mbstring, zip, bcmath, gd, redis
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
          --optimize-autoloader

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate key
        run: php artisan key:generate

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=256M

      - name: Run tests
        run: vendor/bin/pest
